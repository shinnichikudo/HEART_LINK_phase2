spring.application.name=heartlink

spring.datasource.url=jdbc:postgresql://localhost:5432/heartlink
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swipe lock strategy: "pair" (pair-level advisory lock) or "row" (legacy user row lock)
heartlink.swipe.lock-strategy=pair


# JWT (dev defaults - override JWT_SECRET outside local dev; must be >= 32 bytes)
app.jwt.secret=${JWT_SECRET:heartlink-dev-secret-change-me-please-32b}
app.jwt.expires-in=3600
app.jwt.refresh-expires-in=604800

# Per-user token-bucket limits. Refill is continuous within the configured period.
heartlink.rate-limit.swipe.capacity=20
heartlink.rate-limit.swipe.refill-tokens=20
heartlink.rate-limit.swipe.refill-period=60s
heartlink.rate-limit.recommendations.capacity=30
heartlink.rate-limit.recommendations.refill-tokens=30
heartlink.rate-limit.recommendations.refill-period=60s
heartlink.rate-limit.chat-send.capacity=20
heartlink.rate-limit.chat-send.refill-tokens=20
heartlink.rate-limit.chat-send.refill-period=60s
heartlink.rate-limit.chat-history.capacity=60
heartlink.rate-limit.chat-history.refill-tokens=60
heartlink.rate-limit.chat-history.refill-period=60s